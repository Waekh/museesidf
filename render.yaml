# Render Blueprint — déploie l'API, le worker et PostgreSQL en un clic.
#
# 1. Pusher ce fichier sur le repo GitHub
# 2. Sur https://dashboard.render.com → New → Blueprint → sélectionner le repo
# 3. Render détecte render.yaml et crée les 3 services + la BDD
# 4. Renseigner les variables d'environnement marquées "sync: false"
#
# Doc : https://docs.render.com/infrastructure-as-code

databases:
  - name: museesidf-db
    plan: free
    databaseName: musees_idf
    user: museesidf

services:
  # ── API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: museesidf-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    plan: free

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: museesidf-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ton-app.vercel.app   # ← REMPLACER par ton domaine Vercel
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAGENDA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6

    healthCheckPath: /api/health

  # ── Worker (APScheduler — scraping périodique) ─────────────────────
  - type: worker
    name: museesidf-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    plan: free

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: museesidf-db
          property: connectionString
      - key: OPENAGENDA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
