# Déploiement production : docker compose -f docker-compose.prod.yml up -d --build
#
# Différences avec le compose de dev :
# - pas de montage du code source, pas de hot-reload
# - PostgreSQL non exposé sur l'hôte, volume persistant dédié
# - frontend buildé et servi par Nginx, qui proxifie /api vers l'API
# - restart automatique des services

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-musees_idf}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-musees_idf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - scraper_cache_prod:/tmp/musees_idf_cache
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata_prod:
  scraper_cache_prod:
